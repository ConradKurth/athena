"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Copy gitignored credential files into every new Athena workspace (they are not
# in git, so Conductor must propagate them). Mirrors Cyclone's pattern.
# .home/ holds the Shopify CLI OAuth session token (theme + admin logins), so
# copying it means new workspaces inherit the login instead of re-authing.
file_include_globs = ".env*\ngcs-service.json\n.home/**\n"

[scripts]
run_mode = "concurrent"
